    M 152,312
    C 158,288 182,264 210,256
    C 228,250 242,240 255,228
    C 261,222 268,218 275,216
    C 288,218 306,230 322,248
    C 334,262 340,280 338,300
    C 336,320 334,344 334,366
    C 334,392 314,422 290,430
    C 272,436 240,436 218,428
    C 196,420 174,402 162,378
